<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#334155" stroke-width="6" />

  <!-- Outer Film Reel / Disc Accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow-grad)" stroke-width="14" stroke-dasharray="24 16" opacity="0.85" filter="url(#glow)" />

  <!-- Center Double-D / Vision Aperture -->
  <g transform="translate(146, 156)">
    <!-- 'D' shape left -->
    <path d="M 30,20 L 90,20 C 140,20 170,55 170,100 C 170,145 140,180 90,180 L 30,180 Z" fill="none" stroke="#f59e0b" stroke-width="20" stroke-linejoin="round" />
    <!-- 'V' shape right -->
    <path d="M 120,30 L 160,170 L 200,30" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- TV 4K HDR Badge -->
  <rect x="180" y="380" width="152" height="40" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="256" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">4K DoVi</text>
</svg>
